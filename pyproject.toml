[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antifasis"
version = "1.1.0"
description = "Agregador de titulares y noticias de los 20 principales medios españoles, con almacenamiento en PostgreSQL por fecha."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Antifasis" }]
dependencies = [
    "beautifulsoup4>=4.12",
    "charset-normalizer>=3.0",
    "feedparser>=6.0.11",
    "Flask>=3.0",
    "gunicorn>=21.2",
    "psycopg[binary]>=3.1",
    "requests>=2.31",
    "tzdata>=2023.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
antifasis = "antifasis.cli:main"

[tool.setuptools]
packages = ["antifasis"]

[tool.setuptools.package-data]
antifasis = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integracion: requiere una base de datos PostgreSQL real (TEST_DATABASE_URL)",
]

[tool.ruff]
target-version = "py39"
line-length = 100
